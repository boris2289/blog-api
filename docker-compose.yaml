services:
  nginx:
    image: nginx:1.27-alpine
    container_name: blog_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_web
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    expose:
      - "8000"
    env_file:
      - settings/.env
    environment:
      RUN_MIGRATIONS: "true"
      WAIT_FOR_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "true"
      RUN_COMPILEMESSAGES: "true"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - app_data:/app/data
    depends_on:
      - redis
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: blog_db
    env_file:
      - settings/.env
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    expose:
      - "6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_celery_worker
    command: celery -A settings worker -l info
    env_file:
      - settings/.env
    environment:
      RUN_MIGRATIONS: "false"
      WAIT_FOR_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "false"
      RUN_COMPILEMESSAGES: "false"
      BLOG_SEED_DB: "false"
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
      - db
      - web
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_celery_beat
    command: celery -A settings beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - settings/.env
    environment:
      RUN_MIGRATIONS: "false"
      WAIT_FOR_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "false"
      RUN_COMPILEMESSAGES: "false"
      BLOG_SEED_DB: "false"
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
      - db
      - web
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_flower
    command: >
      sh -c 'celery -A settings flower --port=5555
      --basic_auth="$$BLOG_FLOWER_USER:$$BLOG_FLOWER_PASSWORD"'
    ports:
      - "5555:5555"
    env_file:
      - settings/.env
    environment:
      RUN_MIGRATIONS: "false"
      WAIT_FOR_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "false"
      RUN_COMPILEMESSAGES: "false"
      BLOG_SEED_DB: "false"
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
      - db
      - web
    restart: unless-stopped

volumes:
  static_data:
  media_data:
  postgres_data:
  app_data: